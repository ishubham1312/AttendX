name: attendx
description: "Attendance Tracker - track daily attendance and salary effortlessly."
publish_to: "none"
version: 2.5.1+2

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: 6.1.5+1
  hive: 2.2.3
  hive_flutter: 1.1.0
  shared_preferences: 2.5.3
  flutter_local_notifications: 17.2.3
  timezone: 0.9.4
  intl: 0.19.0
  home_widget: ^0.9.2
  package_info_plus: ^10.1.0
  dio: ^5.9.2
  path_provider: ^2.1.5
  open_filex: ^4.7.0
  url_launcher: ^6.3.2
  geolocator: ^14.0.3
  flutter_map: ^8.3.0
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icons/

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "assets/res/mipmap-xxxhdpi/ic_launcher_adaptive_back.png"
  adaptive_icon_foreground: "assets/res/mipmap-xxxhdpi/ic_launcher_adaptive_fore.png"
